<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComicCraft</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="page">
  <section class="hero">
    <span class="badge">AI COMIC STORY CREATOR</span>
    <h1>Turn your idea into a comic.</h1>
    <p>Enter your story details and generate a five-panel comic with AI.</p>
  </section>

  <section class="card">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form action="/generate" method="post" id="comic-form">
      <label for="story_prompt">Story Prompt</label>
      <textarea id="story_prompt" name="story_prompt" rows="5" maxlength="2000" required>{{ form_data.story_prompt if form_data else "" }}</textarea>

      <div class="grid">
        <div>
          <label for="character_name">Main Character Name</label>
          <input id="character_name" name="character_name" maxlength="80" value="{{ form_data.character_name if form_data else '' }}" required>
        </div>
        <div>
          <label for="setting">Setting</label>
          <select id="setting" name="setting">
            {% for x in ["forest","school","city","space","village"] %}<option value="{{ x }}">{{ x|title }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="tone">Story Tone</label>
          <select id="tone" name="tone">
            {% for x in ["light-hearted","dramatic","poetic","funny","mysterious"] %}<option value="{{ x }}">{{ x|title }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="art_style">Art Style</label>
          <select id="art_style" name="art_style">
            {% for x in ["anime","pixel art","comic book","realistic","watercolor"] %}<option value="{{ x }}">{{ x|title }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <button class="button" id="generate-button" type="submit">Generate My Comic</button>
      <p class="hint">AI generation may take a few minutes.</p>
    </form>
  </section>
</main>
<script src="/static/js/app.js"></script>
</body>
</html>
